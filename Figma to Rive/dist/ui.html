<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --bg:#1e1e1e; --panel:#2a2a2a; --panel2:#262626; --line:#3d3d3d; --text:#e8e8e8; --muted:#9b9b9b; --accent:#0d99ff;
    --code:#383838; --err:#f87171; --warn:#fbbf24; --ok:#4ade80; --info:#60a5fa; --fixbg:#12372a; --fixfg:#86efac; --chip:#27304d; --chipline:#3b4a7a; --chiptext:#c7d2fe; }
  html, body { background: var(--bg); }
  body { font: 12px/1.5 Inter, system-ui, sans-serif; margin: 0; padding: 0 16px 20px; color: var(--text); }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); }
  p b, p code { color: var(--text); }
  a { color: var(--accent); }
  button { font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; margin-right: 6px; transition: filter .12s, background .12s; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:hover { filter: brightness(1.1); }
  button.alt { background: #3a3a3a; color: var(--text); }
  button[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--text); outline: none; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #6f6f6f; }
  .box { margin-top: 12px; padding: 10px; border-radius: 6px; background: var(--panel); color: var(--text); }
  /* colour only as a thin marker, never as text */
  .box.ok { border-left: 3px solid var(--ok); } .box.warn { border-left: 3px solid var(--warn); } .box.bad { border-left: 3px solid var(--err); } .box.info { border-left: 3px solid var(--info); }
  .box.warn li, .box.info li { color: #cfcfcf; }
  code { background: var(--code); color: var(--text); padding: 1px 4px; border-radius: 3px; }
  ul { margin: 4px 0 0 16px; padding: 0; } pre { white-space: pre-wrap; margin: 6px 0 0; font-size: 11px; max-height: 120px; overflow: auto; color: var(--text); }
  label { display: block; margin: 8px 0 4px; color: var(--muted); }
  label.chk { display: flex; gap: 8px; align-items: flex-start; color: var(--text); margin: 6px 0; }
  label.chk input { width: auto; margin-top: 2px; accent-color: var(--accent); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 -16px 14px; padding: 6px 16px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .tab { background: none; color: var(--muted); border-radius: 6px 6px 0 0; padding: 8px 12px; margin: 0; }
  .tab:hover { color: var(--text); filter: none; }
  .tab.on { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
  .score { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; background: var(--panel); }
  .score b.n { font-size: 26px; line-height: 1; color: var(--text); }
  .pill { display: inline-block; padding: 1px 8px 1px 6px; border-radius: 10px; font-size: 11px; margin-right: 4px; color: #cfcfcf; background: #363636; }
  .pill::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .pill.error::before { background: #ef4444; } .pill.warning::before { background: #f59e0b; } .pill.info::before { background: #3b82f6; }
  .issue { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .issue.error { border-left: 4px solid #ef4444; } .issue.warning { border-left: 4px solid #f59e0b; } .issue.info { border-left: 4px solid #3b82f6; }
  .issue h3 { font-size: 12px; margin: 0 0 4px; color: var(--text); }
  .issue .fix { margin-top: 6px; padding: 6px 8px; background: #323232; border-radius: 6px; color: var(--text); }
  .issue .why { color: #b5b5b5; }
  button.sm { padding: 3px 8px; font-size: 11px; margin: 6px 6px 0 0; }
  .muted { color: var(--muted); }
  .layers { margin-top: 8px; }
  .layers .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { background: #333; color: #ddd; border: 1px solid #4a4a4a; border-radius: 12px; padding: 2px 9px; font-size: 11px; margin: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { background: #3f3f3f; } .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .linkbtn { background: none; color: var(--accent); padding: 2px 4px; margin: 4px 0 0; font-size: 11px; }
  .more[hidden] { display: none; }
  .tabs .gear { margin: 0 0 0 auto; padding: 6px 8px; background: none; color: var(--muted); font-size: 16px; line-height: 1; border-radius: 6px; }
  .tabs .gear:hover, .tabs .gear.on { color: var(--accent); filter: none; }
  #settings { margin: 0 0 12px; padding: 10px; border-radius: 8px; background: var(--panel); }
  #settings[hidden] { display: none; }
  #settings label { margin-top: 0; }
  #tokenNote { margin-top: 6px; min-height: 14px; }
  .sec { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .field { margin-bottom: 2px; } .field label { margin: 0 0 4px; } .hint { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
  details.opts { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
  details.opts summary { cursor: pointer; padding: 9px 10px; color: var(--text); font-weight: 500; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.opts summary::-webkit-details-marker { display: none; }
  details.opts summary::before { content: '\25B8'; color: var(--muted); transition: transform .12s; }
  details.opts[open] summary::before { transform: rotate(90deg); }
  details.opts .body { padding: 0 10px 6px; border-top: 1px solid var(--line); }
  .actions { display: flex; gap: 8px; margin-top: 16px; } .actions button { margin: 0; flex: 1; padding: 10px 14px; } .actions button.alt { flex: 0 0 auto; }
  input:disabled { opacity: .5; }
  .recent { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .recent .rtop { display: flex; justify-content: space-between; gap: 8px; } .recent .rtop b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .rbtns { display: flex; gap: 6px; flex-wrap: wrap; } .recent .rbtns button { margin: 6px 0 0; } .recent a { text-decoration: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b6b6b; align-self: center; margin-left: auto; margin-right: 2px; flex: none; }
  .dot + .gear { margin-left: 0; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--err); } .dot.off { background: #6b6b6b; }
  .score b.n { min-width: 44px; text-align: center; }
  .score .sub { margin-top: 4px; }
  .issue h3 { display: flex; align-items: baseline; gap: 6px; }
  .issue .why { margin-top: 2px; }
  .head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; } .head-actions button { margin: 0; }
  .group-title { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 18px 0 0; }
  .empty { padding: 14px; border-radius: 8px; background: var(--panel); text-align: center; color: var(--text); margin-top: 12px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; border: 2px solid var(--bg); } ::-webkit-scrollbar-track { background: var(--bg); }
</style>
<div class="tabs">
  <button class="tab on" id="tabImport">Import</button>
  <button class="tab" id="tabAnalysis">Design analysis</button>
  <span class="dot off" id="dot" title="Helper: checking"></span>
  <button class="gear" id="gear" title="Settings" aria-label="Settings">&#9881;</button>
</div>
<div id="settings" hidden>
  <label for="token">Helper token <span class="muted">(printed by the helper window). Press Enter to save.</span></label>
  <input id="token" placeholder="paste token, then press Enter" autocomplete="off" spellcheck="false">
  <div class="muted" id="tokenNote"></div>
  <div class="muted" id="helperState" style="margin-top:8px"></div>
</div>
<div id="paneAnalysis" hidden>
  <p>Check the selected frames <b>before</b> importing. See what will break or look different in Rive, and how to fix it in Figma.</p>
  <div class="head-actions"><button id="runAnalysis">Analyse selection</button><button id="sendClaude" class="alt" title="Saves the report, frame previews and design data in the helper's claude-inbox folder">Send to Claude</button>
  <span class="muted" id="selInfo"></span></div>
  <div id="analysisOut"></div>
</div>
<div id="paneImport">
<div class="box" id="detected" style="margin-top:0">Select a frame in Figma to begin.</div>

<div class="sec">Name</div>
<div class="field">
  <label for="projname">File name in Rive</label>
  <input id="projname" placeholder="detected from the selected frame">
  <div class="hint">The artboard keeps the frame name.</div>
</div>

<div class="sec">Destination</div>
<div class="field">
  <label for="filelink">Add to an open Rive file <span class="muted">(optional)</span></label>
  <input id="filelink" placeholder="Paste its link or id, or leave empty for a new file">
</div>

<details class="opts">
  <summary>Import options</summary>
  <div class="body">
    <label class="chk"><input type="checkbox" id="optArtboard" checked><span><b>Frame properties become the artboard's</b><br><span class="muted">Size, fill and layout. Uncheck to import the frame as a layout box inside a plain artboard.</span></span></label>
    <label class="chk"><input type="checkbox" id="optComp" checked><span><b>Components</b><br><span class="muted">Instances are detached into layout; each main component also becomes a Rive component artboard.</span></span></label>
    <label class="chk"><input type="checkbox" id="optInner" checked><span><b>Inner shadows cover inner layers</b><br><span class="muted">Like Figma. Uncheck to keep them under the contents.</span></span></label>
    <label class="chk"><input type="checkbox" id="optAuto"><span><b>Push automatically after it verifies</b><br><span class="muted">Skips the extra click. This changes your Rive file straight away.</span></span></label>
  </div>
</details>

<div class="actions">
  <button id="send">Send to Rive</button><button id="zip" class="alt" title="Download the converted files without using the helper">Zip only</button>
</div>
<div class="hint" style="margin-top:8px">Auto layout becomes Rive layout. Text stays live text.</div>

<div id="out"></div>
<div id="recents"></div>
</div>
<script>/* Figma snapshot -> Rive RML.
 *
 * Pure function, no Figma API: it takes the plain-JSON snapshot that code.js
 * extracts, so the same file runs inside the plugin UI and in Node for tests.
 *
 * The two rules this plugin exists for:
 *   1. Auto layout is never flattened. An auto layout frame becomes a
 *      LayoutComponent (+ LayoutComponentStyle); children that sit in the flow
 *      get a LayoutParticipant. Gap, padding, alignment, wrap, hug/fill/fixed and
 *      absolute positioning all carry over as layout properties.
 *   2. Text is never outlined. A TEXT node always becomes Text + TextStylePaint +
 *      TextValueRun, and the font it needs is reported, never baked into paths.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.FigmaToRive = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  function convert(snapshot, options) {
    options = options || {};
    var warnings = [];
    var fonts = {}; // key -> {family, style, file, assetId}
    var nextId = 100;
    var fontAssetIds = {};
    var imageAssets = {};   // hash -> {file, id, hash, ext}
    var notes = [];
    var detached = 0;
    var seenWarn = {};
    var frameAsLayout = options.frameMode === 'layout';
    var componentArtboards = options.componentArtboards !== false;

    function id() { return '0:' + nextId++; }
    function warn(node, msg) {
      var k = msg + '|' + (node && node.type);
      var line = (node ? '"' + node.name + '" (' + node.type + '): ' : '') + msg;
      if (seenWarn[line]) return;
      seenWarn[line] = true;
      warnings.push(line);

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/\r?\n/g, '&#10;');
    }
    function num(v) { return String(Math.round(v * 1000) / 1000); }
    function attr(name, v) { return v === undefined || v === null ? '' : ' ' + name + '="' + esc(v) + '"'; }

    // ---- colour -------------------------------------------------------
    function hex2(v) { var s = Math.max(0, Math.min(255, Math.round(v * 255))).toString(16); return s.length < 2 ? '0' + s : s; }
    function colorHex(c, opacity) {
      var a = (c.a === undefined ? 1 : c.a) * (opacity === undefined ? 1 : opacity);

    // ---- paint --------------------------------------------------------
    function invert(t) { // 2x3 affine [[a,c,e],[b,d,f]]
      var a = t[0][0], c = t[0][1], e = t[0][2], b = t[1][0], d = t[1][1], f = t[1][2];
      var det = a * d - b * c;

    function apply(t, x, y) { return [t[0][0] * x + t[0][1] * y + t[0][2], t[1][0] * x + t[1][1] * y + t[1][2]]; }

    // centered: the paint belongs to a Shape, whose local origin is its centre. A layout box (and the artboard) measures from its top-left.
    function paintBody(paint, node, w, h, extraOpacity, centered) {
      var gx = centered ? w / 2 : 0, gy = centered ? h / 2 : 0;
      var op = (paint.opacity === undefined ? 1 : paint.opacity) * (extraOpacity === undefined ? 1 : extraOpacity);
      if (paint.type === 'SOLID') {

      }

      }
      if (paint.type === 'GRADIENT_RADIAL' && paint.gradientTransform && paint.gradientStops) {

    function visiblePaints(list) {

    function findImage(node) {
      var imgs = visiblePaints(node.fills).filter(function (p) { return p.type === 'IMAGE'; });
      return imgs.length ? imgs[imgs.length - 1] : null;
    }
    // Plain fills only (artboard background).
    function plainFills(node, w, h) {
      return visiblePaints(node.fills).filter(function (p) { return p.type !== 'IMAGE'; }).map(function (p) {
        var body = paintBody(p, node, w, h);
        return body ? '<Fill' + paintBlend(p, node) + ' name="Fill">' + body + '</Fill>' : '';
      }).join('');
    }

    // All the paints of one shape / layout box, in Rive's draw order (later paints draw on top):
    //   drop shadows (feathered fills) -> outside stroke -> fills -> inner shadows -> strokes
    // Shadows and layer blur use Feather; INSIDE strokes are a 2x stroke the caller clips to the shape.
    function paintsXml(node, w, h, o) {
      o = o || {};
      var fx = (node.effects || []).filter(function (e) { return e.visible !== false; });
      var drops = fx.filter(function (e) { return e.type === 'DROP_SHADOW'; });
      var inners = fx.filter(function (e) { return e.type === 'INNER_SHADOW'; });
      var blur = fx.filter(function (e) { return e.type === 'LAYER_BLUR'; })[0];
      if (fx.some(function (e) { return e.type === 'BACKGROUND_BLUR'; })) warn(node, 'background blur is not supported');
      var fills = o.lineOnly ? [] : visiblePaints(node.fills).filter(function (p) { return p.type !== 'IMAGE'; });
      var strokes = visiblePaints(node.strokes);
      var sw = typeof node.strokeWeight === 'number' ? node.strokeWeight : 0;
      var hasStroke = strokes.length && sw > 0;
      var surface = fills.length || hasStroke || o.hasImage;
      var blurFx = blur ? '<Feather strength="' + num(blur.radius) + '" name="Feather"/>' : '';
      if (blur && o.hasChildren) warn(node, 'layer blur only blurs this box\'s own paint, not the things inside it');

      function featherFill(e, inner) {
        if (e.spread) warn(node, 'shadow spread is ignored');
        // An inner shadow cannot spread further than the shape is wide; huge blur values (Figma allows them) would just wash
        // everything out when drawn over the contents, so the strength is capped relative to the shape's smaller side.
        var strength = e.radius;
        if (inner && o.splitInner) strength = Math.min(e.radius * (options.innerShadowScale || 1), (options.innerShadowCap || 0.35) * Math.min(w, h));
        return '<Fill fillRule="clockwise"' + (options.effectBlendModes === false ? '' : paintBlend(e, node)) + ' name="' + (inner ? 'Inner Shadow' : 'Shadow') + '"><SolidColor colorValue="' + colorHex(e.color) +
          '" name="Color"/><Feather strength="' + num(strength) + '" offsetX="' + num(e.offset ? e.offset.x : 0) + '" offsetY="' +
          num(e.offset ? e.offset.y : 0) + '"' + (inner ? ' inner="true"' : '') + ' name="Feather"/></Fill>';
      }
      var dashFx = '';
      if (node.dashPattern && node.dashPattern.length) {
        var dp = node.dashPattern.length % 2 ? node.dashPattern.concat(node.dashPattern) : node.dashPattern;
        dashFx = '<DashPath name="Dashes">' + dp.map(function (d, i) { return '<Dash length="' + num(d) + '" name="' + (i % 2 ? 'Gap' : 'Dash') + '"/>'; }).join('') + '</DashPath>';
      }
      // Stroke ends and corners follow Figma. Old snapshots do not carry them: keep the previous round look, except for
      // dashed strokes where round ends would swallow the gaps.
      var CAP = { NONE: 'butt', ROUND: 'round', SQUARE: 'square' }, JOIN = { MITER: 'miter', ROUND: 'round', BEVEL: 'bevel' };
      var capV = CAP[node.strokeCap] || (dashFx ? 'butt' : 'round'), joinV = JOIN[node.strokeJoin] || (o.forceCenter ? 'miter' : 'round');

        return strokes.map(function (p) {
          var body = paintBody(p, node, w, h, undefined, o.centered);

      if (surface) drops.forEach(function (e) { var f = featherFill(e, false); if (o.splitShadow) shadowOut += f; else out += f; shadowed = true; });
      var shadowBlocksClip = shadowed && !o.splitShadow;
      var align = o.forceCenter ? 'CENTER' : (node.strokeAlign || 'CENTER');

        var opaque = fills.some(function (p) { return p.type === 'SOLID' && (p.opacity === undefined || p.opacity >= 0.99) && (p.color.a === undefined || p.color.a >= 0.99); });

        }

      fills.forEach(function (p) {
        var body = paintBody(p, node, w, h, undefined, o.centered);

      });
      if (surface) inners.forEach(function (e) { var f = featherFill(e, true); if (o.splitInner) innerOut += f; else out += f; });
      return { xml: out + tail, shadowXml: shadowOut, innerXml: innerOut, clip: clip, shadowed: shadowed };
    }

      COLOR_DODGE: 'colorDodge', COLOR_BURN: 'colorBurn', HARD_LIGHT: 'hardLight', SOFT_LIGHT: 'softLight', DIFFERENCE: 'difference',
      EXCLUSION: 'exclusion', HUE: 'hue', SATURATION: 'saturation', COLOR: 'color', LUMINOSITY: 'luminosity' };
    // A single fill or stroke can have its own blend mode too (Figma: the blend icon in the paint popover).

      if (!b || b === 'NORMAL' || b === 'PASS_THROUGH') return '';
      if (BLEND[b]) return ' blendModeValue="' + BLEND[b] + '"';
      warn(node, 'a fill or stroke uses the ' + b + ' blend mode, which Rive does not have; drawn normally');
      return '';

    b.onclick = function () { selectIds(b.getAttribute('data-ids').split(','), null); };
  });
  Array.prototype.forEach.call(analysisOut.querySelectorAll('button[data-one]'), function (b) {
    b.onclick = function () { selectIds([b.getAttribute('data-one')], b); };
  });
  Array.prototype.forEach.call(analysisOut.querySelectorAll('button[data-toggle]'), function (b) {
    b.onclick = function () {
      var id = b.getAttribute('data-toggle'), more = b.parentNode.querySelector('.more');
      expanded[id] = !expanded[id]; more.hidden = !expanded[id];
      b.textContent = expanded[id] ? 'See less' : 'See ' + (more.querySelectorAll('.chip').length) + ' more';
    };
  });
  Array.prototype.forEach.call(analysisOut.querySelectorAll('button[data-text]'), function (b) {

}
onmessage = function (e) {
  var m = e.data.pluginMessage; if (!m) return;
  if (m.type === 'analysisSnapshot') { renderAnalysis(m); return; }
  if (m.type === 'claudePayload') { sendToInbox(m); return; }
  if (m.type === 'selection') {
    showSelection(m);
    selInfo.textContent = m.count ? m.count + ' selected' : 'nothing selected';
    if (!paneAnalysis.hidden) { clearTimeout(analysisTimer); analysisTimer = setTimeout(runAnalysis, 400); }
    return;
  }
  if (m.type === 'settings') { tokenEl.value = m.token; if (!m.token) toggleSettings(true); checkHelper(); links = m.links || {}; recents = m.recents || []; snaps = m.snaps || {}; var sf = m.selection && m.selection.file; if (m.fileLink && sf && !links[sf]) links[sf] = m.fileLink; renderRecents(); if (m.opts) { optArt.checked = m.opts.artboard !== false; optComp.checked = m.opts.comp !== false; optInner.checked = m.opts.inner !== false; optAuto.checked = m.opts.autoPush === true; } showSelection(m.selection); return; }
  if (m.type === 'error') { out.innerHTML = '<div class="box bad">' + esc(m.message) + '</div>'; return; }
  if (m.type !== 'snapshot') return;
  var name = projectName(m, 'figma-import');
  var res = FigmaToRive.convert({ nodes: m.nodes, components: m.components, images: m.images }, { name: name, frameMode: optArt.checked ? 'artboard' : 'layout', componentArtboards: optComp.checked, innerShadowOverChildren: optInner.checked });
  last = { name: name, bytes: m.imageBytes || {} };
  if (mode === 'zip') { out.innerHTML = '<div class="box ok">Converted ' + m.nodes.length + ' frame(s).</div>' + notesHtml(res) + warningsHtml(res) + zipHtml(res, name); return; }
  if (m.fileName) curFile = curFile || m.fileName;
  var fileId = ((linkEl.value.match(/file\/[^\/]+\/(\d+)/) || linkEl.value.match(/^\s*(\d+)\s*$/) || [])[1]) || '';
  var linkUsed = linkEl.value; // what this send really uses (Update may differ from the field)
  if (resendPrev !== null) { linkEl.value = resendPrev; resendPrev = null; } else linkChanged(); // Update must not change the remembered link
  if (linkUsed.trim() && !fileId) { out.innerHTML = '<div class="box bad">I could not find a file id in that link. It should look like https://editor.rive.app/file/name/1234567</div>'; return; }
  var curSnap = flatten(m.nodes), wasUpdate = viaUpdate; viaUpdate = false;
  var selIds = (m.nodes || []).map(function (n) { return n.id; }), frameNames = (m.nodes || []).map(function (n) { return n.name; });
  function runExport() {
  out.innerHTML = '<div class="box">Sending to the helper…</div>';
  return call('/export', { name: name, rml: res.rml, yaml: res.yaml, fonts: res.fonts, fileId: fileId, images: res.images.map(function (im) { return { file: im.file, base64: toB64(last.bytes[im.hash]) }; }) }).then(function (r) {
    var ok = r.verify.ok, f = r.fonts, html = '<div class="box ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? 'Built and verified with rive' : 'rive found errors') + '</b>' +
      '<br>' + (r.mode === 'existing' ? 'Added to your open file (nothing in it removed): <b>' + (r.added || []).map(esc).join(', ') + '</b>. A copy of the file as it is now is saved in <code>Exports/backups/</code>.' : 'Saved in <code>Exports/' + esc(r.name) + '</code>') + (ok ? '' : '<pre>' + esc(r.verify.output) + '</pre>') + '</div>';
    if (f.standIn.length) html += '<div class="box warn"><b>Stand-in fonts used</b> (add real files to <code>Fonts Library/</code> and send again):<ul>' + f.standIn.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    if (f.missing.length) html += '<div class="box bad"><b>Missing fonts</b>: ' + f.missing.map(esc).join(', ') + '</div>';
    html += notesHtml(res) + warningsHtml(res);
    if (ok) html += '<p style="margin-top:12px"><button id="push">' + (r.mode === 'existing' ? 'Add to my open Rive file' : 'Push to my Rive account') + '</button></p><p>' + (r.mode === 'existing' ? 'Updates file ' + r.fileId + ' with your current content plus the new artboard(s). Rive also keeps the previous version in the file\'s revision history.' : r.linked ? 'This updates the Rive file this export is already linked to (old versions stay in its revision history).' : 'This creates a new file in your Rive project.') + '</p>';
    var prevSnap = snaps[r.name], changes = ok && prevSnap ? changesHtml(diffSnaps(prevSnap.map, curSnap), prevSnap.time) : (ok && wasUpdate ? '<div class="box info"><b>No change report this time.</b><br><span class="muted">There is no earlier record of this file to compare with. From the next Update on, you will see what changed here before you push.</span></div>' : '');
    if (ok) { snaps[r.name] = { time: Date.now(), map: curSnap }; var keep = Object.keys(snaps).sort(function (a, b) { return snaps[b].time - snaps[a].time; }); keep.slice(5).forEach(function (k) { delete snaps[k]; }); }
    out.innerHTML = changes + html + zipHtml(res, name);
    var fileUrl = r.mode === 'existing' ? 'https://editor.rive.app/file/' + r.fileId : '';
    var prev = recents.filter(function (x) { return x.name === r.name; })[0];
    addRecent({ name: r.name, mode: r.mode === 'existing' ? 'existing' : 'new', time: Date.now(), ids: selIds, frames: frameNames, link: r.mode === 'existing' ? String(r.fileId) : '', url: fileUrl || (prev && prev.url) || '', pushed: !!(prev && prev.pushed && r.mode !== 'existing') });
    var pb = document.getElementById('push');
    if (pb) pb.onclick = function () {
      pb.disabled = true; pb.textContent = 'Pushing…';
      call('/push', { name: r.name, label: 'Figma import' }).then(function (p) {
        var h = '<div class="box ' + (p.ok ? 'ok' : 'bad') + '"><b>' + (p.ok ? 'Pushed to Rive' : 'Push failed') + '</b>' +
          (p.url ? '<br><a href="' + p.url + '" target="_blank">' + p.url + '</a>' : '') + (p.ok ? '' : '<pre>' + esc(p.output) + '</pre>') + '</div>';
        out.insertAdjacentHTML('afterbegin', h); pb.textContent = 'Pushed';
        if (p.ok) patchRecent(r.name, { pushed: true, time: Date.now(), url: p.url || fileUrl, link: r.mode === 'existing' ? String(r.fileId || '') : '' });
      }).catch(function (er) { out.insertAdjacentHTML('afterbegin', '<div class="box bad">' + esc(er.message) + '</div>'); pb.disabled = false; pb.textContent = 'Try again'; });
    };
    if (pb && optAuto.checked && !prevSnap && !wasUpdate) pb.click(); // an update always waits, so you can read the change report first
  }).catch(function (er) {
    out.innerHTML = '<div class="box bad"><b>Could not reach the helper.</b> ' + esc(er.message) + '<br>Run <code>node serve.js</code> in the plugin folder and paste its token. You can still use “Zip only”.</div>' + warningsHtml(res) + zipHtml(res, name);
  });
  }
  // Before sending: warn about fonts that are not in the library, and about updating a file that was already pushed.
  var wanted = (res.fonts || []).map(function (f) { return String(f.file).replace(/^fonts\//, ''); });
  var again = !fileId && recents.filter(function (x) { return x.name === name && x.pushed; })[0];
  call('/status').then(function (st) { return st.realFonts || []; }, function () { return null; }).then(function (real) {
    var miss = real ? wanted.filter(function (f) { return real.indexOf(f) < 0; }) : [], msgs = [];
    if (miss.length) msgs.push('<b>These fonts are not in your Fonts Library</b>, so a stand-in font will be used: <ul>' + miss.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>');
    if (again) msgs.push('<b>“' + esc(name) + '” was already pushed.</b> Sending again updates that same Rive file (the old version stays in its revision history).');
    if (!msgs.length) { runExport(); return; }
    out.innerHTML = '<div class="box warn">' + msgs.join('<br>') + '<p style="margin:10px 0 0"><button id="goOn">Send anyway</button><button id="goStop" class="alt">Cancel</button></p></div>';
    document.getElementById('goOn').onclick = runExport;
    document.getElementById('goStop').onclick = function () { out.innerHTML = ''; };
  });
};
